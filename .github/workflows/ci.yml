name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: swift test
      - name: Package app
        run: ./build-app.sh
      - name: Validate bundle
        run: |
          plutil -lint build/SoundViz.app/Contents/Info.plist
          codesign --verify --strict build/SoundViz.app
